<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt – Bohem Pub Bratislava</title>
  <meta name="description" content="Kontakt na Bohem Pub – Gallayova 1, Bratislava-Dúbravka. Tel: +421 910 662 662.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Bohem</a>
  <ul class="nav-menu" id="navMenu">
    <li><a href="index.html">Domov</a></li>
    <li><a href="ponuka.html">Naša ponuka</a></li>
    <li><a href="galeria.html">Galéria</a></li>
    <li><a href="eventy.html">Eventy</a></li>
    <li><a href="recenzie.html">Hodnotenie</a></li>
    <li><a href="kontakt.html" class="nav-reserve active">Kontakt</a></li>
  </ul>
  <div class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
</nav>

<div class="contact-wrap" style="grid-template-columns: 1fr;">
  <!-- INFO – naplní JS z DB -->
  <div class="contact-info" style="border-right: none; border-bottom: none; min-height: auto;">
    <span class="section-tag">Kde nás nájdete</span>
    <h1 class="section-title">Kontakt</h1>

    <div class="contact-block">
      <span class="clabel">Adresa</span>
      <div class="cvalue" id="cAddr"></div>
    </div>

    <div class="contact-block">
      <span class="clabel">Otváracie hodiny</span>
      <div class="hours" id="hoursGrid"></div>
    </div>

    <div class="contact-block">
      <span class="clabel">Telefón</span>
      <div class="cvalue" id="cTel"></div>
    </div>

    <div class="contact-block">
      <span class="clabel">Sledujte nás</span>
      <div class="cvalue" id="cSocial"></div>
    </div>

    <div class="map-frame" style="max-width: 800px;">
      <iframe id="mapFrame" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</div>

<footer>
  <span class="footer-logo">Bohem Pub</span>
  <ul class="footer-nav">
    <li><a href="index.html">Domov</a></li>
    <li><a href="ponuka.html">Ponuka</a></li>
    <li><a href="galeria.html">Galéria</a></li>
    <li><a href="eventy.html">Eventy</a></li>
  </ul>
  <p class="footer-copy" id="fCopy"></p>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  // fill contact info from DB
  document.getElementById('cAddr').innerHTML = DB.info.address.replace(', ', '<br>');
  document.getElementById('cTel').innerHTML =
          `<a href="tel:${DB.info.tel.replace(/\s/g,'')}">${DB.info.tel}</a>
     <br><span style="font-size:.82rem;color:var(--muted)">Súkromné akcie:</span>
     <br><a href="tel:${DB.info.telEvents.replace(/\s/g,'')}">${DB.info.telEvents}</a>`;
  document.getElementById('cSocial').innerHTML =
          `<a href="${DB.info.instagram}" target="_blank" style="display:block;margin-bottom:.3rem">📸 @bohempub_dubravka</a>
     <a href="${DB.info.facebook}"  target="_blank" style="display:block;margin-bottom:.3rem">👍 Facebook</a>
     <a href="${DB.info.wolt}"      target="_blank" style="display:block">🔵 Wolt</a>`;
  document.getElementById('mapFrame').src = DB.info.mapsEmbed;
  document.getElementById('fCopy').innerHTML =
          `© 2025 ${DB.info.name} · ${DB.info.address} · <a href="tel:${DB.info.tel.replace(/\s/g,'')}">${DB.info.tel}</a>`;
</script>
</body>
</html>
